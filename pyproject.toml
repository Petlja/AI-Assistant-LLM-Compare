[project]
name = "plct-llm-compare"
version = "0.1.0"
description = "PLCT LLM Compare package."
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.13,<4.0"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click",
    "openai",
    "pandas",
    "pydantic",
    "pyyaml",
    "transformers",
    "plct-server",
    "pip>=26.0.1",
]

[project.scripts]
plcmp = "plct_llm_compare.plcmp:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = true

[tool.uv.sources]
plct-server = { path = "../PLCT-Server", editable = true }

[tool.hatch.build.targets.sdist]
include = ["src/plct_llm_compare"]

[tool.hatch.build.targets.wheel]
include = ["src/plct_llm_compare"]

[tool.hatch.build.targets.wheel.sources]
"src/plct_llm_compare" = "plct_llm_compare"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
